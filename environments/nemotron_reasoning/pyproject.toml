[project]
name = "nemotron-reasoning"
description = "Single-turn RLVR env: reasoning puzzle -> boxed answer, grader-as-verifier."
tags = ["reasoning", "math", "single-turn", "train", "eval"]
version = "0.1.2"
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.14",
    "datasets>=2.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["nemotron_reasoning.py", "pyproject.toml", "data/*.csv"]

# The wheel target needs the csv explicitly force-included (plain `include` only affects the
# sdist for a top-level module), else load_environment can't find data/train.csv at runtime.
[tool.hatch.build.targets.wheel]
include = ["nemotron_reasoning.py"]

[tool.hatch.build.targets.wheel.force-include]
"data/train.csv" = "data/train.csv"

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 1
